# ---------- 主站：zhouyiai.cc ----------
server {
    listen 443 ssl;
    http2 on;
    server_name zhouyiai.cc www.zhouyiai.cc;
    ssl_certificate /etc/letsencrypt/live/zhouyiai.cc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zhouyiai.cc/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    client_max_body_size 100m;   # 图片/音视频上传

    location = /docs {
        return 301 /docs/;
    }

    location ^~ /docs/ {
        alias /www/custom_for_newapi/docs/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 升级（Realtime API 也走主域名时需要）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 关闭缓冲，保证 SSE 流式输出实时下发
        proxy_buffering      off;
        proxy_cache          off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        # 长推理超时
        proxy_connect_timeout 75s;
        proxy_send_timeout    1h;
        proxy_read_timeout    1h;
    }

}

# ---------- API 子域名：api.zhouyiai.cc ----------
server {
    listen 443 ssl;
    http2 on;
    server_name api.zhouyiai.cc;
    ssl_certificate /etc/letsencrypt/live/zhouyiai.cc/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/zhouyiai.cc/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    client_max_body_size 100m;

    # 仅放行中转相关前缀
    location ~ ^/(v1|v1beta|mj|suno|kling|jimeng|pg)(/|$) {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;   # /v1/realtime WebSocket
        proxy_set_header Connection $connection_upgrade;

        proxy_buffering         off;
        proxy_cache             off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        proxy_connect_timeout 75s;
        proxy_send_timeout    1h;
        proxy_read_timeout    1h;
    }

    # 其他路径直接 404 或跳回主站
    location / {
        return 301 https://zhouyiai.cc$request_uri;
    }

}

# ---------- 80 → 443 ----------
server {
    if ($host = api.zhouyiai.cc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = zhouyiai.cc) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name zhouyiai.cc www.zhouyiai.cc api.zhouyiai.cc;
    return 301 https://$host$request_uri;




}


